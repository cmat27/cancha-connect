AWSTemplateFormatVersion: '2010-09-09'
Description: Infrastructura para CanchaConnect - App de Torneos de Fútbol
Resources:
  CanchaConnectTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CanchaConnectData
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DynamoDBAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            Resource:
              Fn::GetAtt:
              - CanchaConnectTable
              - Arn
  ApiLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CanchaConnect-ApiGatewayHandler
      Runtime: nodejs24.x
      Handler: src/index.handler
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME:
            Ref: CanchaConnectTable
      Code:
        S3Bucket: ''
        S3Key: ''
  CanchaConnectHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: CanchaConnectHTTPAPI
      ProtocolType: HTTP
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: CanchaConnectHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::GetAtt:
        - ApiLambdaFunction
        - Arn
      PayloadFormatVersion: '2.0'
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: CanchaConnectHttpApi
      RouteKey: $default
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: ApiIntegration
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ApiLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CanchaConnectHttpApi}/*/*
Outputs:
  ApiEndpoint:
    Description: URL de la API Gateway
    Value:
      Fn::Sub: https://${CanchaConnectHttpApi}.execute-api.${AWS::Region}.amazonaws.com/

name: CI/CD Pipeline - CanchaConnect Full Stack

on:
  push:
    branches:
      - main
      - 'test_*'
  pull_request:
    branches:
      - main
      - 'test_*'

# Prevent concurrent deployments from locking CloudFormation stacks
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------
  # Job 1: Test & Lint Code (Runs on PRs and Pushes)
  # ---------------------------------------------------------
  validate:
    name: 🧪 Unit Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend Unit Tests
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Frontend Build Verification
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production

  # ---------------------------------------------------------
  # Job 2: Deploy to AWS (Branch-Based Dynamic Environment Routing)
  # ---------------------------------------------------------
  deploy:
    name: 🚀 Deploy to AWS Cloud
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Dynamically determine target environment based on branch name:
      # - push to 'main' -> dev environment
      # - push to 'test_*' -> staging environment
      - name: Determine Target Environment
        id: env-config
        run: |
          REF_NAME="${{ github.ref_name }}"
          echo "Branch triggered: $REF_NAME"

          if [[ "$REF_NAME" == "main" ]]; then
            echo "Targeting DEV Environment"
            echo "ENV_NAME=dev" >> $GITHUB_OUTPUT
            echo "BUCKET_NAME=canchaconnect-deployments-dev" >> $GITHUB_OUTPUT
            echo "ALLOWED_ORIGIN=*" >> $GITHUB_OUTPUT
          elif [[ "$REF_NAME" == test_* ]]; then
            echo "Targeting STAGING Environment"
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
            echo "BUCKET_NAME=canchaconnect-deployments-staging" >> $GITHUB_OUTPUT
            echo "ALLOWED_ORIGIN=https://staging.canchaconnect.com" >> $GITHUB_OUTPUT
          else
            echo "Defaulting to DEV Environment"
            echo "ENV_NAME=dev" >> $GITHUB_OUTPUT
            echo "BUCKET_NAME=canchaconnect-deployments-dev" >> $GITHUB_OUTPUT
            echo "ALLOWED_ORIGIN=*" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Package Backend Lambda
        working-directory: backend
        run: |
          npm ci --production
          zip -r ../backend.zip . -x "server.js" "test/*" "*.git*"

      - name: Upload Lambda Package to S3
        run: |
          aws s3 cp backend.zip s3://${{ steps.env-config.outputs.BUCKET_NAME }}/backend.zip

      - name: Deploy CloudFormation Infrastructure
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name CanchaConnectStack-${{ steps.env-config.outputs.ENV_NAME }} \
            --parameter-overrides \
                Environment=${{ steps.env-config.outputs.ENV_NAME }} \
                DeploymentBucket=${{ steps.env-config.outputs.BUCKET_NAME }} \
                AllowedOrigin="${{ steps.env-config.outputs.ALLOWED_ORIGIN }}" \
            --capabilities CAPABILITY_IAM

      - name: Get CloudFormation Stack Outputs
        id: cfn
        run: |
          STACK="CanchaConnectStack-${{ steps.env-config.outputs.ENV_NAME }}"
          
          UI_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name $STACK \
            --query "Stacks[0].Outputs[?OutputKey=='UIBucketName'].OutputValue" \
            --output text)
            
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name $STACK \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
            
          echo "UI_BUCKET=$UI_BUCKET" >> $GITHUB_OUTPUT
          echo "DIST_ID=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Build & Deploy Frontend Assets to S3
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production
          aws s3 sync dist/canchaconnect s3://${{ steps.cfn.outputs.UI_BUCKET }}/ --delete

      - name: Invalidate CloudFront CDN Cache
        run: |
          DIST_ID="${{ steps.cfn.outputs.DIST_ID }}"
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          fi

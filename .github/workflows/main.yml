name: CI/CD Pipeline - CanchaConnect Full Stack

on:
  push:
    branches:
      - main
      - re-structure
  pull_request:
    branches:
      - main
      - re-structure

# Prevent concurrent deployments from locking CloudFormation stacks
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------
  # Job 1: Test & Lint Code (Runs on PRs and Pushes)
  # ---------------------------------------------------------
  validate:
    name: 🧪 Unit Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend Unit Tests
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Frontend Build Verification
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production

  # ---------------------------------------------------------
  # Job 2: Deploy to AWS (Runs only on Push to Main / Re-Structure)
  # ---------------------------------------------------------
  deploy:
    name: 🚀 Deploy to AWS Cloud
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Package Backend Lambda
        working-directory: backend
        run: |
          npm ci --production
          zip -r ../backend.zip . -x "server.js" "test/*" "*.git*"

      - name: Upload Lambda Package to S3
        run: |
          aws s3 cp backend.zip s3://${{ secrets.DEPLOYMENT_BUCKET || 'canchaconnect-deployments-dev' }}/backend.zip

      - name: Deploy CloudFormation Infrastructure
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name CanchaConnectStack-${{ vars.ENVIRONMENT || 'dev' }} \
            --parameter-overrides \
                Environment=${{ vars.ENVIRONMENT || 'dev' }} \
                DeploymentBucket=${{ secrets.DEPLOYMENT_BUCKET || 'canchaconnect-deployments-dev' }} \
                AllowedOrigin="${{ vars.ALLOWED_ORIGIN || '*' }}" \
            --capabilities CAPABILITY_IAM

      - name: Get CloudFormation Stack Outputs
        id: cfn
        run: |
          STACK="CanchaConnectStack-${{ vars.ENVIRONMENT || 'dev' }}"
          
          UI_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name $STACK \
            --query "Stacks[0].Outputs[?OutputKey=='UIBucketName'].OutputValue" \
            --output text)
            
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name $STACK \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
            
          echo "UI_BUCKET=$UI_BUCKET" >> $GITHUB_OUTPUT
          echo "DIST_ID=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Build & Deploy Frontend Assets to S3
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production
          aws s3 sync dist/canchaconnect s3://${{ steps.cfn.outputs.UI_BUCKET }}/ --delete

      - name: Invalidate CloudFront CDN Cache
        run: |
          DIST_ID="${{ steps.cfn.outputs.DIST_ID }}"
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          fi

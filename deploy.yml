name: Deploy CanchaConnect to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.REGION }} # Replace with your region if different

    # Packages your backend code while excluding server.js and node_modules
    - name: Package Code
      run: |
        zip -r ../../backend.zip . -x "server.js" "node_modules/*"
      # zip -r backend.zip . -x "backend/server.js" "node_modules/*" ".git/*" ".github/*"

    # Uploads package to your existing S3 deployment bucket
    - name: Upload to S3
      run: |
        aws s3 cp backend.zip ${{ secrets.S3_BUCKET_NAME }}

    # Triggers Lambda update directly from S3
    - name: Update Lambda Function
      run: |
        aws lambda update-function-code \
          --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
          --s3-bucket ${{ secrets.S3_BUCKET_NAME }} \
          --s3-key backend.zip \
          --publish